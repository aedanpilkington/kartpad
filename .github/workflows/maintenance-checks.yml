name: Maintenance coordinator checks
on:
  pull_request:
    paths:
      - 'scripts/maintenance-state.py'
      - 'tests/test_maintenance_state.py'
      - '.github/workflows/maintenance-checks.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/maintenance-state.py'
      - 'tests/test_maintenance_state.py'
      - '.github/workflows/maintenance-checks.yml'
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p test_maintenance_state.py -v
